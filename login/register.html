<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h3>Silahkan Daftar Akun</h3>
        <form id="registerForm">
            <label for="username">Nama Pengguna</label>
            <input type="text" id="username" name="username" placeholder="Nama Pengguna .." required="required" autocomplete="username">
            
            <label for="password">Kata Sandi</label>
            <input type="password" id="password" name="password" placeholder="Kata Sandi .." required="required">
            
            <button type="submit" id="btnRegister">Daftar</button>
        </form>
        <p>Sudah punya akun? <a href="index.html">Login di sini</a></p>
    </div>

    <script src="register.js"></script>
</body>
</html>
